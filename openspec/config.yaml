schema: spec-driven

context: |
  Porchlight is a Devpost "Build With AI: Basics" hackathon entry. The proof of
  concept was planned and built with the Devpost Learn skill pack; the commit
  tagged `poc-complete` is that snapshot. OpenSpec plans every feature added after it.
  - Never rewrite devpost/scope.md, devpost/prd.md, devpost/spec.md or
    devpost/checklist.md. Judges check them as proof the skill pack was used.
    The only allowed edit is the "Post-PoC Additions" list at the end of
    prd.md and spec.md: add one line per archived change.
  - Never edit the vendored Devpost Learn skills (.claude/skills/1-start ...
    6-ship, .agents/skills, agent/) or skills-lock.json.
  - Hard deadline: Devpost submission closes 2026-10-26 5:00 pm ET. A feature
    must work reliably end to end before it is demoed. Prefer small, polished
    changes that strengthen the core story (family homepage, AI-driven widgets)
    over broad new systems.
  - The user is learning backend and API development in Go through this
    project. Keep the backend idiomatic Go and explain new Go concepts briefly.

