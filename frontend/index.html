<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The browser bar's color: each theme's ground (src/theme.ts updates it
         when a member picks a theme that differs from the device's). -->
    <meta name="theme-color" content="#f7f2ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#18120e" media="(prefers-color-scheme: dark)" />
    <title>Kinlight</title>
    <script>
      // Before the first paint: show the theme this device last showed the
      // member (src/theme.ts remembers it), so the page never flashes the
      // other one. "auto" follows the device.
      ;(function () {
        var theme = 'auto'
        try {
          theme = localStorage.getItem('kinlight.theme') || 'auto'
        } catch (e) {}
        var dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
